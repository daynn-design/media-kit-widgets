<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .count {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 700;
      font-size: 32px;
      color: #FFFFFF; /* 흰색 글씨 */
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); /* 흰 배경에서도 보이게 그림자 추가 */
      letter-spacing: -0.5px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="followers" class="count">Loading...</div>

  <script>
    // 구글 시트 웹에 게시 CSV 주소
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRarIjap3EMVBpmtOIoQ5xBmlJ9HYJsSjwHTn_HHvVNm240S_kFxcvNEIK-f2qZ9qKyx2GgiWKKz7MG/pub?gid=0&single=true&output=csv";

    async function loadFollowers() {
      try {
        const response = await fetch(CSV_URL);
        const text = await response.text();
        
        // 줄 단위 분리
        const rows = text.trim().split("\n");
        if (rows.length < 2) {
          throw new Error("No data rows found");
        }

        // 2번째 행(Ale 데이터 행) 콤마 분리
        const cols = rows[1].split(",");
        
        // C열 (인덱스 2): ig_followers
        const rawValue = cols[2].trim();
        const numericCount = Number(rawValue);

        if (!isNaN(numericCount) && numericCount > 0) {
          // 천 단위 콤마 포맷팅 (192,744)
          document.getElementById("followers").innerText = numericCount.toLocaleString();
        } else {
          document.getElementById("followers").innerText = rawValue || "--";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("followers").innerText = "192,744"; // 로딩 실패 시 백업용 표시
      }
    }

    loadFollowers();
  </script>
</body>
</html>
